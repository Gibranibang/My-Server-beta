name: Build and Publish MyServer Backend Image

on:
  push:
    branches:
      - main
    paths:
      - "resources/MyServer-Backend-ZimaOS.zip"
      - "resources/backend_manifest.json"
      - ".github/workflows/build-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract backend version and unpack build context
        id: meta
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("resources/backend_manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/backend-build
          mkdir -p /tmp/backend-build
          unzip -q resources/MyServer-Backend-ZimaOS.zip -d /tmp/backend-build
          ls -la /tmp/backend-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch backend image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/backend-build
          file: /tmp/backend-build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gibranibang/myserver-backend:latest
            ghcr.io/gibranibang/myserver-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
