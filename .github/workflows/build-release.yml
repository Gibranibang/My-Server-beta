name: Build Windows Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing or new GitHub Release tag (e.g. v4.5.6-beta) to attach built assets to'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SYNCTHING_VERSION: v2.1.7
      EASYTIER_VERSION: v2.6.4
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and app version
        id: meta
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}".Trim()
          }

          $verLine = Select-String -Path "build_installer_package.py" -Pattern '^VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $verLine) {
            throw "Could not determine VERSION from build_installer_package.py"
          }
          $ver = $verLine.Matches[0].Groups[1].Value
          Write-Host "Resolved app version: $ver"
          Write-Host "Resolved release tag: $tag"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'MyServer Desktop Companion UI/package-lock.json'

      - name: Build Companion Frontend UI
        working-directory: MyServer Desktop Companion UI
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri shell (MyServer-Beta.exe)
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo build --release
          if (-not (Test-Path "target\release\MyServer-Beta.exe")) {
            throw "MyServer-Beta.exe was not generated"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Python build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pythonnet paramiko cryptography bcrypt pynacl

      - name: Build Core Service (myserver-core.exe)
        shell: pwsh
        run: |
          pyinstaller --noconfirm myserver-core.spec
          if (-not (Test-Path "dist\myserver-core.exe")) {
            throw "dist\myserver-core.exe was not generated"
          }

      - name: Verify Core Service bundled DLLs
        shell: python
        run: |
          import struct
          with open(r"dist\myserver-core.exe", "rb") as f:
              raw = f.read()
          idx = raw.rfind(b"MEI\x0c\x0b\x0a\x0b\x0e")
          assert idx >= 0, "PyInstaller archive not found"
          _, pkg_len, toc_off, toc_len, pyver, pylib = struct.unpack("!8sIIII64s", raw[idx:idx+88])
          pkg_start = idx + 88 - pkg_len
          toc_data = raw[pkg_start + toc_off : pkg_start + toc_off + toc_len]
          pos = 0
          dlls = []
          bad = []
          while pos < len(toc_data):
              elen, *_ = struct.unpack("!IIIIBB", toc_data[pos:pos+18])
              name = toc_data[pos+18:pos+elen].split(b"\x00")[0].decode("utf-8", errors="replace")
              low = name.lower()
              if low.endswith(".dll"):
                  dlls.append(name)
              if "ucrtbase" in low or low.startswith("api-ms-win-"):
                  bad.append(name)
              pos += elen
          print("Bundled DLL count:", len(dlls))
          for d in sorted(dlls):
              print("  DLL:", d)
          assert not bad, f"Unexpected UCRT/API-set DLLs bundled: {bad}"

      - name: Smoke test Core Service startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process -FilePath "dist\myserver-core.exe" -ArgumentList "--standalone", "--port", "48199" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                throw "myserver-core.exe exited prematurely with code $($proc.ExitCode)"
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:48199/api/ping" -TimeoutSec 2 -UseBasicParsing
                if ($resp.StatusCode -eq 200) {
                  Write-Host "Ping response: $($resp.Content)"
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "myserver-core.exe did not listen on 127.0.0.1:48199 within 15s"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Download Syncthing and EasyTier Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "bin\easytier" | Out-Null
          New-Item -ItemType Directory -Force -Path "resources\deps\easytier\win32\x64" | Out-Null
          $tmpDir = Join-Path $env:RUNNER_TEMP "myserver_deps"
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null

          # 1. Syncthing
          $stZip = Join-Path $tmpDir "syncthing.zip"
          $stExtract = Join-Path $tmpDir "syncthing"
          $stUrl = "https://github.com/syncthing/syncthing/releases/download/$($env:SYNCTHING_VERSION)/syncthing-windows-amd64-$($env:SYNCTHING_VERSION).zip"
          Write-Host "Downloading Syncthing from $stUrl"
          Invoke-WebRequest -Uri $stUrl -OutFile $stZip
          Expand-Archive -Path $stZip -DestinationPath $stExtract -Force
          $stExe = Get-ChildItem -Path $stExtract -Recurse -Filter "syncthing.exe" | Select-Object -First 1
          if (-not $stExe) { throw "syncthing.exe not found in downloaded archive" }
          Copy-Item -Path $stExe.FullName -Destination "bin\syncthing.exe" -Force

          # 2. EasyTier
          $etZip = Join-Path $tmpDir "easytier.zip"
          $etExtract = Join-Path $tmpDir "easytier"
          $etUrl = "https://github.com/EasyTier/EasyTier/releases/download/$($env:EASYTIER_VERSION)/easytier-windows-x86_64-$($env:EASYTIER_VERSION).zip"
          Write-Host "Downloading EasyTier from $etUrl"
          Invoke-WebRequest -Uri $etUrl -OutFile $etZip
          Expand-Archive -Path $etZip -DestinationPath $etExtract -Force
          $requiredFiles = @("easytier-core.exe", "easytier-cli.exe", "wintun.dll", "Packet.dll", "WinDivert64.sys")
          foreach ($fname in $requiredFiles) {
            $found = Get-ChildItem -Path $etExtract -Recurse -Filter $fname | Select-Object -First 1
            if (-not $found) { throw "$fname not found in EasyTier archive" }
            Copy-Item -Path $found.FullName -Destination "bin\easytier\$fname" -Force
            Copy-Item -Path $found.FullName -Destination "resources\deps\easytier\win32\x64\$fname" -Force
          }

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y --no-progress
            $found = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $found) {
            throw "ISCC.exe (Inno Setup 6) not found after installation"
          }
          Write-Host "Using ISCC.exe at: $found"
          "ISCC_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package portable ZIP and Inno Setup installer
        shell: pwsh
        run: |
          python build_installer_package.py
          $ver = "${{ steps.meta.outputs.version }}"
          $expected = @(
            "dist\MyServer-v$ver-Beta.zip",
            "dist\MyServer-v$ver-Beta-Setup.exe",
            "dist\MyServer-Setup.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) {
              throw "Expected package missing: $f"
            }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myserver-windows-v${{ steps.meta.outputs.version }}-beta
          path: |
            dist/MyServer-v*-Beta.zip
            dist/MyServer-v*-Beta-Setup.exe
            dist/MyServer-Setup.exe

      - name: Upload assets to GitHub Release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $zipPath = "dist\MyServer-v$ver-Beta.zip"
          $setupVerPath = "dist\MyServer-v$ver-Beta-Setup.exe"
          $setupGenericPath = "dist\MyServer-Setup.exe"

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if (-not $releaseExists) {
            Write-Host "Creating release $tag..."
            gh release create $tag --target "${{ github.sha }}" --title "MyServer v$ver Beta" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }

          Write-Host "Uploading Windows desktop packages to release $tag..."
          gh release upload $tag $zipPath $setupVerPath $setupGenericPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to release $tag" }
